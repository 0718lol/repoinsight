[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "repoinsight"
version = "0.1.0"
description = "Static analysis toolkit: symbol tables, call graphs, module dependency graphs and code metrics for Python codebases."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "repoinsight contributors" }]
keywords = ["static-analysis", "call-graph", "dependency-graph", "code-metrics", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
repoinsight = "repoinsight.cli:main"

[project.urls]
Homepage = "https://github.com/example/repoinsight"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"repoinsight.report.assets" = ["*.css", "*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
check_untyped_defs = true
