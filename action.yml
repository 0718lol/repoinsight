name: 'repoinsight'
description: 'Run repoinsight static analysis and gate on the architecture health score'
branding:
  icon: 'activity'
  color: 'blue'
inputs:
  path:
    description: 'Project root to analyze'
    required: false
    default: '.'
  args:
    description: 'Extra arguments, e.g. "--min 70" to gate on health score, or "--config path"'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install repoinsight
      shell: bash
      run: python -m pip install --upgrade pip && python -m pip install "${{ github.action_path }}"
    - name: Run repoinsight
      shell: bash
      run: repoinsight score "${{ inputs.path }}" ${{ inputs.args }}
